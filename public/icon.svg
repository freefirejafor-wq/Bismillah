<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <!-- Outer decorative border -->
  <rect x="34" y="34" width="444" height="444" rx="84" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.45" />
  <!-- Ledger Book Cover -->
  <rect x="128" y="106" width="268" height="300" rx="26" fill="#ffffff" />
  <!-- Spine -->
  <rect x="116" y="106" width="44" height="300" rx="14" fill="url(#gold)" />
  <!-- Spine rings -->
  <circle cx="138" cy="166" r="8" fill="#064e3b" />
  <circle cx="138" cy="256" r="8" fill="#064e3b" />
  <circle cx="138" cy="346" r="8" fill="#064e3b" />
  <!-- Ledger Header Bar -->
  <rect x="184" y="138" width="184" height="40" rx="10" fill="#065f46" />
  <!-- Gold Taka Accent Circle -->
  <circle cx="276" cy="242" r="44" fill="#ecfdf5" stroke="#065f46" stroke-width="8" />
  <text x="276" y="261" text-anchor="middle" font-family="sans-serif" font-size="56" font-weight="700" fill="#065f46">৳</text>
  <!-- Ledger Lines -->
  <rect x="188" y="314" width="176" height="16" rx="8" fill="#cbd5e1" />
  <rect x="188" y="348" width="124" height="16" rx="8" fill="#94a3b8" />
  <rect x="324" y="348" width="40" height="16" rx="8" fill="#10b981" />
</svg>
